name: Terraform Destroy

"on":
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to delete all Terraform-managed resources"
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Generate destroy plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Display destroy plan
        run: terraform show destroy.tfplan

      - name: Destroy AWS resources
        run: terraform apply -auto-approve destroy.tfplan
