
name: Terraform Destroy

"on":
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to delete all Terraform-managed resources"
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Empty ECR repositories
        shell: bash
        run: |
          set -euo pipefail

          for repo in todo-app-backend todo-app-frontend; do
            echo "Checking ECR repository: $repo"

            if aws ecr describe-repositories \
              --repository-names "$repo" >/dev/null 2>&1; then

              while true; do
                image_ids=$(aws ecr list-images \
                  --repository-name "$repo" \
                  --query 'imageIds[*]' \
                  --output json)

                if [ "$image_ids" = "[]" ]; then
                  echo "$repo is empty."
                  break
                fi

                batch=$(echo "$image_ids" | python3 -c \
                  'import json,sys; print(json.dumps(json.load(sys.stdin)[:100]))')

                result=$(aws ecr batch-delete-image \
                  --repository-name "$repo" \
                  --image-ids "$batch" \
                  --output json)

                echo "$result"

                failures=$(echo "$result" | python3 -c \
                  'import json,sys; print(len(json.load(sys.stdin).get("failures", [])))')

                if [ "$failures" -gt 0 ]; then
                  echo "ERROR: Some images in $repo could not be deleted."
                  exit 1
                fi
              done
            else
              echo "$repo does not exist; skipping."
            fi
          done

      - name: Generate fresh destroy plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Display destroy plan
        run: terraform show destroy.tfplan

      - name: Destroy AWS resources
        run: terraform apply -auto-approve destroy.tfplan
