
name: Terraform Destroy

"on":
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to delete all Terraform-managed resources"
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Empty ECR repositories
        shell: bash
        run: |
          set -euo pipefail

          for repo in todo-app-backend todo-app-frontend; do
            echo "======================================"
            echo "Processing ECR repository: $repo"
            echo "======================================"

            if ! aws ecr describe-repositories \
              --repository-names "$repo" >/dev/null 2>&1; then
              echo "Repository $repo does not exist; skipping."
              continue
            fi

            emptied=false

            for attempt in $(seq 1 30); do
              echo "Attempt $attempt for $repo"

              # Get image digests and media types.
              aws ecr describe-images \
                --repository-name "$repo" \
                --output json > /tmp/ecr-images.json

              # Delete manifest-list/index images first.
              python3 - <<'PY' > /tmp/ecr-manifests.txt
          import json
          with open("/tmp/ecr-images.json") as f:
              data = json.load(f)
          for image in data.get("imageDetails", []):
              media = image.get("imageManifestMediaType", "")
              if media in (
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.oci.image.index.v1+json",
              ):
                  digest = image.get("imageDigest")
                  if digest:
                      print(digest)
          PY

              while IFS= read -r digest; do
                [ -z "$digest" ] && continue
                echo "Deleting manifest list/index: $digest"

                aws ecr batch-delete-image \
                  --repository-name "$repo" \
                  --image-ids "imageDigest=$digest" \
                  --output json > /tmp/ecr-delete.json

                python3 - <<'PY'
          import json, sys
          with open("/tmp/ecr-delete.json") as f:
              data = json.load(f)
          failures = data.get("failures", [])
          if failures:
              print(json.dumps(failures, indent=2))
              sys.exit(1)
          PY
              done < /tmp/ecr-manifests.txt

              # Delete remaining images in batches of at most 100.
              aws ecr list-images \
                --repository-name "$repo" \
                --query 'imageIds[*].imageDigest' \
                --output text > /tmp/ecr-digests.txt

              python3 - <<'PY' > /tmp/ecr-batches.txt
          import json
          with open("/tmp/ecr-digests.txt") as f:
              values = f.read().split()
          for start in range(0, len(values), 100):
              print(json.dumps([
                  {"imageDigest": digest}
                  for digest in values[start:start + 100]
              ]))
          PY

              while IFS= read -r batch; do
                [ -z "$batch" ] && continue

                echo "Deleting image batch from $repo"

                aws ecr batch-delete-image \
                  --repository-name "$repo" \
                  --image-ids "$batch" \
                  --output json > /tmp/ecr-delete.json

                python3 - <<'PY'
          import json
          with open("/tmp/ecr-delete.json") as f:
              data = json.load(f)
          failures = data.get("failures", [])
          for failure in failures:
              print(json.dumps(failure))
          PY
              done < /tmp/ecr-batches.txt

              remaining=$(aws ecr list-images \
                --repository-name "$repo" \
                --query 'length(imageIds)' \
                --output text)

              if [ "$remaining" = "0" ]; then
                echo "Repository $repo is empty."
                emptied=true
                break
              fi

              echo "$remaining image entries remain; retrying."
              sleep 2
            done

            if [ "$emptied" != "true" ]; then
              echo "ERROR: Could not empty $repo after 30 attempts."
              exit 1
            fi
          done

      - name: Generate fresh destroy plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Display destroy plan
        run: terraform show destroy.tfplan

      - name: Destroy AWS resources
        run: terraform apply -auto-approve destroy.tfplan
