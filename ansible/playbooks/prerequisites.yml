
---
- name: Prepare EC2 nodes for Kubernetes
  hosts: kubernetes
  become: true
  gather_facts: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
          - apt-transport-https
          - software-properties-common
        state: present

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap persistently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\n]\S*\s+\S+\s+swap\s+\S+.*)$'
        replace: '# \1'
        backup: true

    - name: Configure kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load bridge networking kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure Kubernetes networking parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"

    - name: Apply kernel networking parameters
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Verify swap is disabled
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false
      failed_when: swap_status.stdout | trim | length > 0

    - name: Confirm node preparation
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is prepared for Kubernetes installation."
